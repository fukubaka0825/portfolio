name: Rebuild external feeds

on:
  schedule:
    # 06:17 JST daily: refresh the external feeds shown in the Writing section.
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Cloudflare Workers build
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo '::error::CLOUDFLARE_WORKERS_DEPLOY_HOOK is not configured'
            exit 1
          fi
          curl -q --fail --silent --show-error --retry 3 --retry-delay 5 \
            --output /dev/null --request POST "$DEPLOY_HOOK"
